name: Local integration tests - Basic Version

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  basic-integration-test:
    runs-on: ${{ matrix.os }}
    environment:
      name: Test
      deployment: false
    strategy:
      matrix:
        os: [macos-13, windows-2022]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        node-version: [20]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install packages
        run: npm install
      - name: Allow running mkcert on Mac
        run: sudo security authorizationdb write com.apple.trust-settings.admin allow
        if: runner.os == 'MacOS'
      - name: Install mkcert
        run: brew install mkcert
        if: runner.os == 'MacOS'
      - name: Run mkcert setup [mkcert -install]
        run: mkcert -install
        if: runner.os == 'MacOS'
      - name: Add environment variables to .env file
        run: |
          echo "S3_BUCKET_NAME=$S3_BUCKET_NAME" >> .env
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> .env
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> .env
        shell: bash
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      - name: Install https cert [npm run setup:https]
        run: npm run setup:https
        if: runner.os == 'MacOS'
      - run: |
          mkdir certs
          .\scripts\generate-cert.ps1
        shell: pwsh
        if: runner.os == 'Windows'
      - name: Run integration tests
        run: npm run test:integration
        shell: bash
